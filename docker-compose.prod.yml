# ─────────────────────────────────────────────────────────────
# استقرار production الو کپسول — راهنمای کامل در DEPLOYMENT.md
#   cp .env.production.example .env.production   (و مقادیر را پر کنید)
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# migration پیش از بالا آمدن app خودکار اجرا می‌شود (سرویس migrate).
# ─────────────────────────────────────────────────────────────
name: alocapsule

x-app-env: &app-env
  env_file: .env.production
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-alocapsule}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-alocapsule}?schema=public
    TZ: Asia/Tehran

x-build: &build
  context: .
  args:
    NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
    # صفحه‌ی اصلی هنگام build پیش‌رندر می‌شود؛ باید با مقدار زمان اجرا یکی باشد
    ALLOW_INDEXING: ${ALLOW_INDEXING:-false}
    NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    PRISMA_ENGINES_MIRROR: ${PRISMA_ENGINES_MIRROR:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alocapsule}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-alocapsule}
      TZ: Asia/Tehran
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-alocapsule} -d ${POSTGRES_DB:-alocapsule}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # prisma migrate deploy — یک‌بار پیش از app
  migrate:
    <<: *app-env
    build:
      <<: *build
      target: tools
    image: alocapsule-tools:latest
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # نام سرویس عمداً یکتاست (نه `app`): وقتی روی شبکه‌ی یک reverse proxy مشترک با
  # پروژه‌های دیگر قرار می‌گیرد، نام سرویس alias شبکه می‌شود و `app` با سرویس
  # هم‌نام پروژه‌ی دیگر تداخل می‌کرد (docker-compose.shared-proxy.yml)
  alocapsule-app:
    <<: *app-env
    build:
      <<: *build
      target: runner
    image: alocapsule-app:latest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/public/uploads
      - private_files:/app/storage/private
    expose:
      - "3000"

  # jobهای دوره‌ای + بازسازی کش پس از راه‌اندازی (scripts/ops/jobs-loop.sh)
  jobs:
    <<: *app-env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-alocapsule}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-alocapsule}?schema=public
      TZ: Asia/Tehran
      APP_URL: http://alocapsule-app:3000
    build:
      <<: *build
      target: tools
    image: alocapsule-tools:latest
    command: ["sh", "scripts/ops/jobs-loop.sh"]
    restart: unless-stopped
    depends_on:
      alocapsule-app:
        condition: service_healthy

  # بکاپ روزانه‌ی دیتابیس و فایل‌ها، نگهداری ۱۴ روز (scripts/ops/backup*.sh)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["sh", "/scripts/backup-loop.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-alocapsule}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:-alocapsule}
      BACKUP_DIR: /backups
      DATA_DIR: /data
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: Asia/Tehran
    volumes:
      - ./scripts/ops:/scripts:ro
      - ${BACKUP_PATH:-./backups}:/backups
      - uploads:/data/uploads
      - private_files:/data/private
    depends_on:
      postgres:
        condition: service_healthy

  # HTTPS خودکار (Let's Encrypt) برای DOMAIN — اگر TLS را میزبان/CDN می‌دهد حذف شود
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      alocapsule-app:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  private_files:
  caddy_data:
  caddy_config:
