<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#12301F;border:1px solid rgba(201,168,118,.16);border-radius:24px;padding:14px 14px 18px;display:flex;flex-direction:column;gap:14px;position:relative">
  <div style="background:#2B342E;border:1px dashed rgba(245,240,232,.22);border-radius:18px;height:186px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px">
    <span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#A7B2AB;direction:ltr">640 × 640</span>
    <span style="font-size:12px;color:#A7B2AB">عکس محصول</span>
  </div>
  <sc-if value="{{ badge }}" hint-placeholder-val="{{ false }}">
    <span style="position:absolute;top:24px;right:24px;background:#C9A876;color:#0B1F16;font-size:11px;font-weight:800;padding:5px 11px;border-radius:999px">{{ badge }}</span>
  </sc-if>
  <div style="display:flex;flex-direction:column;gap:7px">
    <span style="font-size:18px;font-weight:700;color:#F5F0E8">{{ title }}</span>
    <span style="font-size:12px;line-height:1.8;color:#94A29A">{{ desc }}</span>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px">
    <span style="font-size:17px;font-weight:700;color:#F5F0E8">{{ price }} <span style="font-size:12px;font-weight:500;color:#94A29A">تومان</span></span>
    <button onClick="{{ onAdd }}" style="width:42px;height:42px;border-radius:999px;background:#2FA84F;display:flex;align-items:center;justify-content:center;flex:none" style-hover="background:#38BD5C">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#08200F" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="6" x2="12" y2="18"></line><line x1="6" y1="12" x2="18" y2="12"></line></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:360},&quot;name&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;باقلوا پسته‌ای&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;desc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;باقلوا پسته‌ای درجه یک از برند علی‌حان&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;۲,۴۰۰,۰۰۰&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;badge&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onAdd&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}"></script>
</body>
</html>
